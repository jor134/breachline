name = "you-cant-hide"   # quest-store branch: its own Worker, its own Durable Objects (Quest-only lobbies)
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The store app loads the game from this domain (bought in Cloudflare, same account). Cloudflare makes the DNS record and
# certificate when the Worker deploys. you-cant-hide.jor134.workers.dev keeps working too.
routes = [
  { pattern = "youcanthidegame.com", custom_domain = true },
  { pattern = "www.youcanthidegame.com", custom_domain = true },
]

# The game (index.html, js, icons, manifest, sw.js) is served from /public.
# Anything that isn't a file there (/ws/<ROOM>) goes to the Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "Library"

# quest-store: accounts, friends, blocks and terrorist matchmaking (src/social.js). Tickets are signed with the SOCIAL_KEY secret
# (falls back to CREATOR_CODE if it is not set).
[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "Social"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Published player-made maps and their textures (the level editor). Publishing needs the CREATOR_CODE secret:
#   Cloudflare dashboard > Workers > breachline > Settings > Variables and Secrets > add secret CREATOR_CODE
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Library"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Social"]

[observability]
enabled = true
