name = "breachline"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The game (index.html, js, icons, manifest, sw.js) is served from /public.
# Anything that isn't a file there (/ws/<ROOM>) goes to the Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "Library"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Published player-made maps and their textures (the level editor). Publishing needs the CREATOR_CODE secret:
#   Cloudflare dashboard > Workers > breachline > Settings > Variables and Secrets > add secret CREATOR_CODE
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Library"]

[observability]
enabled = true
