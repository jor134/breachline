name = "breachline"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The game (index.html, js, icons, manifest, sw.js) is served from /public.
# Anything that isn't a file there (/ws/<ROOM>) goes to the Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
